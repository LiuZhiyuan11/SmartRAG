[project]
name = "SmartRAG"
version = "1.0.0"
description = "Multi-agent hybrid RAG research platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/api.py" = ["E402"]  # 环境引导代码（代理/镜像/.env）必须在导入依赖之前执行
"app/mcp/server.py" = ["E402"]  # pywin32 DLL 路径引导
"scripts/ingest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
